<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルなWebサイト</title>

  <style>
    /* ページ全体 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      color: #333;
      background-color: #f5f5f5;
      padding-bottom: 120px;
    }

    /* ヘッダー */
    header {
      background-color: #440000;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    /* メインコンテンツ */
    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #cc0000;
    }

    section {
      background-color: white;
      margin-bottom: 25px;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h2 {
      color: #cc0000;
      border-left: 5px solid #cc0000;
      padding-left: 10px;
    }

    /* フッター */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #440000;
      color: white;
      text-align: center;
      padding: 15px;
    }

    footer p {
      margin: 5px 0 10px;
    }

    /* ソーシャルメディアリンク */
    .social-links a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    .social-links a:hover {
      color: #cc0000;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Website</h1>
  </header>

  <main>
    <section>
      <h2>邦楽部</h2>
      <p>
        筝、三弦、尺八を演奏しています。
        和気あいあいと活動しています！
      </p>
    </section>

    <section>
      <h2>筝について</h2>
      <p>
        十三絃と十七絃があります。
         <img src="https://github.com/UegaitoNatsumi/kotosite/blob/main/cupcake.jpg?raw=true" alt="サンプル">
      </p>
    </section>
  </main>

  <footer>
    <p>お問い合わせ：info@example.com</p>

    <div class="social-links">
      <a href="#" aria-label="X">X</a>
      <a href="#" aria-label="Instagram">Instagram</a>
      <a href="#" aria-label="Facebook">Facebook</a>
    </div>
  </footer>

</body>
</html>
:::
